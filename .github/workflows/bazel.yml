name: Bazel CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: bazel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Bazel ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Setup Bazelisk
        uses: bazel-contrib/setup-bazel@e8776f58fb6a6e9055cbaf1b38c52ccc5247e9c4 # v0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: bazel build //...

      - name: Build (Windows)
        if: runner.os == 'Windows'
        # Exclude fuzz targets on Windows (rules_fuzzing uses POSIX dirent.h)
        run: bazel build //... -- -//fuzz/...

      - name: Test (Unix)
        if: runner.os != 'Windows'
        run: bazel test //...

      - name: Test (Windows)
        if: runner.os == 'Windows'
        # Exclude fuzz targets on Windows (rules_fuzzing uses POSIX dirent.h)
        run: bazel test //... -- -//fuzz/...

      - name: Run xxhsum binary
        run: |
          echo "Hello, World!" | bazel run //cli:xxhsum
